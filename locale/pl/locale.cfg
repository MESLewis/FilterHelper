[mod-setting-description]
fh-set-filter-on-inserter=Aktywuje pole wyboru „Użyj filtrów” podczas ustawiania filtra w podajniku
fh-default-item-on-splitter=Nazwa przedmiotu, który ma być zawsze widoczny na rozdzielaczach, np. deconstruction-planner. Pozostaw puste, aby wyłączyć.
fh-add-fuel-items=Dodaje kompatybilne paliwa, nawet jeśli nie występują w wejściach i wyjściach
fh-show-only-unlocked-qualities=Maszyna z modułami jakości nie będzie pokazywać w filtrach przedmiotów o jakości wyższej niż ta obecnie zbadana
