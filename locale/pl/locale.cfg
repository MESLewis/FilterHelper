[fh]
button-tooltip=__1__\n__CONTROL__pipette__ aby pobrać na kursor.\n__2__
tooltip-filters=__CONTROL_LEFT_CLICK__ aby ustawić filtr.\n__CONTROL_RIGHT_CLICK__ aby usunąć filtr.
tooltip-container-filters=__CONTROL_LEFT_CLICK__ aby ustawić filtr.\n__CONTROL_RIGHT_CLICK__ aby usunąć filtr.\n__CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ aby ustawić filtr dla wszystkich egzemplarzy tego przedmiotu.\n__CONTROL_KEY_CTRL__ + __CONTROL_LEFT_CLICK__ aby ustawić ten filtr we wszystkich prawidłowych gniazdach.\n__CONTROL_KEY_CTRL__ + __CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ aby ustawić ten filtr we [font=default-bold]wszystkich[/font] gniazdach.\n(__CONTROL_KEY_SHIFT__ lub __CONTROL_KEY_CTRL__) + __CONTROL_RIGHT_CLICK__ aby usunąć ten filtr ze wszystkich gniazd.
tooltip-requests=__CONTROL_LEFT_CLICK__ aby zwiększyć żądanie o 1 stos.\n__CONTROL_RIGHT_CLICK__ aby zmniejszyć żądanie o 1 stos.\n__CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ aby zwiększyć żądanie o 5 stosów.\n__CONTROL_KEY_SHIFT__ + __CONTROL_RIGHT_CLICK__ aby zmniejszyć żądanie o 5 stosów.\n__CONTROL_KEY_CTRL__ + __CONTROL_LEFT_CLICK__ aby ustawić żądanie na wypełnienie pojemnika.\n__CONTROL_KEY_CTRL__ + __CONTROL_RIGHT_CLICK__ aby usunąć żądanie.
filters-full=Filtry pełne
filters-empty=Filtry puste
requests-full=Żądania pełne 
requests-empty=Żądania puste

